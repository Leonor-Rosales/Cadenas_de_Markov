<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Cadenas de Markov</title>
    
    <!-- estilos externos -->
    <link rel="stylesheet" href="/static/styles.css">
    
    <!-- librerías externas -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/dist/vis-network.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/vis-network.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- encabezado -->
        <div class="header">
            <h1>Simulador de Cadenas de Markov</h1>
            <p>Visualiza y calcula la evolución de estados probabilísticos</p>
        </div>

        <div class="content">
            <!-- formulario de entrada -->
            <form id="markovForm">
                <div class="form-group">
                    <label for="numStates">Número de Estados:</label>
                    <input type="number" id="numStates" min="2" max="10" placeholder="ej. 3" required>
                    <button type="button" onclick="generateInputs()">Generar Campos</button>
                </div>

                <!-- campos dinámicos generados por JS -->
                <div id="dynamicInputs" class="hidden">
                    <div class="form-group">
                        <label>Nombres de los Estados:</label>
                        <div id="stateNames"></div>
                    </div>

                    <div class="form-group">
                        <label>Matriz de Transición P (cada columna debe sumar 1):</label>
                        <div id="matrixInput" class="matrix-input"></div>
                    </div>

                    <div class="form-group">
                        <label>Vector de Estado Inicial (debe sumar 1):</label>
                        <div id="vectorInput" class="vector-input"></div>
                    </div>

                    <div class="form-group">
                        <label for="steps">Número de Pasos:</label>
                        <input type="number" id="steps" min="1" max="100" placeholder="ej. 5" required>
                    </div>

                    <button type="submit">Calcular Cadena de Markov</button>
                </div>
            </form>

            <!-- indicador de carga -->
            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Calculando...</p>
            </div>

            <!-- mensajes de error -->
            <div id="error" class="error hidden"></div>

            <!-- resultados -->
            <div id="results" class="hidden">
                <button class="download-btn" onclick="downloadPDF()">📥 Descargar Reporte en PDF</button>
                
                <div class="result-section">
                    <h2>Grafo de Estados</h2>
                    <div id="graph"></div>
                </div>

                <div class="result-section">
                    <h2>Evolución de Estados</h2>
                    <div id="stepsContainer" class="steps-container"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- script principal -->
    <script src="/static/script.js"></script>
</body>
</html>
